[project]
name = "carr-thesis"
version = "0.1.0"
description = "Cost-Aware Reasoning Routing: benchmarking harness and router for open-weight reasoning models on code generation"
readme = "README.md"
# Pinned below 3.13: evalplus and the ONNX embedding stack lack wheels for 3.13+.
requires-python = ">=3.12,<3.13"
dependencies = [
    "evalplus>=0.3.1",
    "matplotlib>=3.11.1",
    "openai>=2.48.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Import `carr` from the repo root without installing it -- this is a research
# codebase run in place, not a distributed package.
pythonpath = ["."]
testpaths = ["tests"]
