# Model roster -- VERIFIED against OpenRouter's live /models endpoint.
#
# Prices are USD per million tokens, copied from the API on the snapshot date.
# Regenerate with:  uv run python scripts/verify_roster.py
#
# Never hardcode a model id anywhere else in the codebase. The open-weight
# landscape moves every 6-8 weeks; this file is the only place that knows.
#
# EVERY MODEL PINS A PROVIDER, and this is not optional.
#
# OpenRouter serves one model slug from many providers at different prices --
# deepseek-v4-pro has 18, spanning $0.87 to $3.48 per M output, a 4x spread.
# GET /models reports only the CHEAPEST provider's price, but routing picks
# whichever provider it likes. On 2026-07-26 a single pilot run was served
# deepseek-v4-pro by nine different providers and was billed 1.54x what this
# table predicted.
#
# Unpinned, the same config on the same problem costs a different amount on
# different days, which makes every CPC and Pareto number irreproducible.
# `provider` below is the OpenRouter routing TAG (not the display name), sent
# as {"provider": {"order": [tag], "allow_fallbacks": false}}. A call either
# runs at the recorded price or fails outright. A failure is recorded and
# resumable; a surprise 4x bill is neither. Prices are that endpoint's price,
# NOT the /models headline.
#
# THE TAG ALSO PINS QUANTIZATION, and that matters more than the price.
#
# The cheapest provider is usually the most quantized: deepseek-v4-flash's
# cheapest endpoint is fp4, kimi-k2.6's is fp4. Serving a 4-bit model and
# calling it "deepseek-v4-flash" would confound the whole thesis -- a failure
# would mean "this quantization failed", not "this model failed", and the
# effort axis would be compared across models of differing fidelity.
#
# Policy: **fp8 or better for every model**, so precision is held constant.
# It is nearly free -- qwen3.5-9b gets bf16 at the same price as fp8,
# deepseek-v4-pro's official endpoint is both the cheapest AND unquantized,
# and only kimi costs more (fp8 $3.40 vs fp4 $2.72). Uptime is recorded
# because allow_fallbacks is off: a provider outage means failed calls.

snapshot_date: "2026-07-26"  # providers pinned this date
verified_against: "https://openrouter.ai/api/v1/models"

# Five models x two effort levels = 10 configs. The held-out model runs on a
# SUBSET of problems, but on both effort levels.
# Pairing each model with itself at two effort levels keeps the effort axis
# clean: the only thing that changes within a pair is the thinking mode.
models:

  - slug: qwen/qwen3.5-9b
    provider: deepinfra/bf16
    quantization: bf16          # held constant across the roster
    provider_uptime_30m: 99.7
    family: qwen
    role: cheapest tier -- the no-reasoning baseline and the floor of the frontier
    price_in_per_m: 0.100
    price_out_per_m: 0.150
    context_length: 262144
    supports_reasoning: true
    efforts:
      - label: "off"
        mechanism: native_toggle
        params: {reasoning: {enabled: false}}
      - label: "high"
        mechanism: native_toggle
        params: {reasoning: {effort: "high"}}

  - slug: deepseek/deepseek-v4-flash
    provider: baidu/fp8
    quantization: fp8          # held constant across the roster
    provider_uptime_30m: 100.0
    family: deepseek
    role: cost-efficient reasoner, mid tier
    # Remarkably cheap for its tier -- cheaper per output token than
    # qwen3.6-35b despite sitting higher on most leaderboards. Expect it to
    # dominate a large stretch of the Pareto frontier.
    price_in_per_m: 0.091
    price_out_per_m: 0.182
    context_length: 1048576
    supports_reasoning: true
    efforts:
      - label: "off"
        mechanism: native_toggle
        params: {reasoning: {enabled: false}}
      - label: "high"
        mechanism: native_toggle
        params: {reasoning: {effort: "high"}}

  - slug: qwen/qwen3.6-35b-a3b
    provider: akashml/fp8
    quantization: fp8          # held constant across the roster
    provider_uptime_30m: 100.0
    family: qwen
    role: mid tier, permissive licence
    price_in_per_m: 0.140
    price_out_per_m: 1.000
    context_length: 262144
    supports_reasoning: true
    efforts:
      - label: "off"
        mechanism: native_toggle
        params: {reasoning: {enabled: false}}
      - label: "high"
        mechanism: native_toggle
        params: {reasoning: {effort: "high"}}

  - slug: deepseek/deepseek-v4-pro
    provider: baidu/fp8
    quantization: fp8          # held constant across the roster
    # NOT deepseek's own endpoint, which is cheapest ($0.870/M) and
    # unquantized. It is blocked by this account's data policy -- OpenRouter
    # returns "No endpoints available matching your guardrail restrictions".
    # Enabling providers that may train on inputs at
    # https://openrouter.ai/settings/privacy would cut this model's output
    # price from $1.251 to $0.870, a 30% saving on the dearest full-grid model.
    provider_uptime_30m: 100.0
    family: deepseek
    role: frontier open-weight reasoner, top tier
    price_in_per_m: 0.625
    price_out_per_m: 1.251
    context_length: 1048576
    supports_reasoning: true
    efforts:
      - label: "off"
        mechanism: native_toggle
        params: {reasoning: {enabled: false}}
      - label: "high"
        mechanism: native_toggle
        params: {reasoning: {effort: "high"}}

# Held out entirely from the CARR build set -- the RQ5 generalization test.
# Kimi is the only non-DeepSeek/Qwen family in the roster, which makes it the
# most genuinely out-of-distribution model available to us.
#
# Evaluated on a SUBSET of problems, not the full grid. RQ5 asks whether CARR
# transfers to an unseen model; that does not require full coverage, and at
# $2.72/M output the full grid would cost more than every other config combined.
held_out:
  - slug: moonshotai/kimi-k2.6
    provider: siliconflow/fp8
    quantization: fp8          # held constant across the roster
    provider_uptime_30m: 100.0
    family: moonshot
    role: RQ5 held-out model
    price_in_per_m: 0.770
    price_out_per_m: 3.400
    context_length: 262144
    supports_reasoning: true
    subset_only: true
    # BOTH efforts, like every other model. `subset_only` cuts the number of
    # problems, never the effort axis: with one effort kimi would have a single
    # point on the cost-accuracy plane, no measurable thinking delta, and RQ5
    # would test transfer along the model axis only -- not the effort axis,
    # which is the one this thesis is about. The cheap half costs $0.10.
    efforts:
      - label: "off"
        mechanism: native_toggle
        params: {reasoning: {enabled: false}}
      - label: "high"
        mechanism: native_toggle
        params: {reasoning: {effort: "high"}}

# Considered and rejected, with reasons -- so we do not re-litigate these.
rejected:
  - slug: moonshotai/kimi-k2.7-code
    reason: >
      $3.50/M output. The strongest coding specialist available, but a single
      thinking config over the full grid would exceed the entire budget.
      Revisit if the budget grows.
  - slug: qwen/qwen-2.5-7b-instruct
    reason: >
      Cheapest model on the platform ($0.10/M out) but no reasoning support.
      qwen3.5-9b with reasoning disabled is a better no-reasoning baseline:
      same price class, and it holds the model constant across the effort axis.
  - slug: z-ai/glm-5.1
    reason: Dropped by user decision on 2026-07-25. See THESIS.md section 12.
