# Experiment parameters. The roster lives in models.yaml; this is everything
# else that must not be hardcoded or silently changed between runs.
#
# The budget block is not documentation -- carr/runner.py reads it and REFUSES
# to make a call that could push total spend past `abort_at_usd`. A cap that
# warns is not a cap.

budget:
  # The ceiling from CLAUDE.md. Never raise this without the user saying so.
  max_spend_usd: 50.00
  # What is actually on the OpenRouter account (2026-07-26).
  loaded_usd: 15.00
  # Where the runner stops, permanently, across every run.
  #
  # Deliberately NOT near the balance. A bigger balance is not a bigger budget:
  # the work is projected at ~$2-4, so $6 is a generous backstop and the
  # remaining $9 stays unspendable no matter what a bug does. Raising this is
  # an edit someone has to make on purpose.
  abort_at_usd: 6.00
  # Printed as a warning, does not stop anything.
  warn_at_usd: 3.00
  # Per-run ceiling, as a multiple of that run's own estimated cost. This is
  # the "if it can be done for $2, never spend more than $2.20" rule made
  # mechanical: a run stops at 1.25x its estimate even when the lifetime cap
  # has room. Stopping is cheap -- bought cells are skipped for free on the
  # next run -- so an early stop costs a re-invocation, not money.
  run_headroom: 1.25

generation:
  # docs/data-spec.md section 2. Changing any of these invalidates comparisons
  # against rows already bought, because request_hash does not cover them.
  temperature: 0.0
  n: 1
  # Per-call ceiling on completion tokens. This is a cost control, not a
  # quality setting: a truncated answer is a legitimate failure that cost a
  # known, bounded amount. It is also what the worst-case cap is computed from.
  # Raised 16000 -> 32000 on 2026-07-26. At 16k, 12 of 12 truncated calls
  # produced ZERO usable code while being billed in full, and thinking configs
  # scored BELOW no-thinking on hard problems -- which measured the ceiling,
  # not the model. The abort threshold, not max_tokens, is the cost control now.
  max_tokens: 32000
  # A failed call is recorded and skipped, not retried in place -- a retry loop
  # is how a cost cap gets defeated. Re-running the script picks it up instead.
  retries: 0
  # Rate limits are the one exception, and only because they cost nothing.
  # allow_fallbacks is off, so an overloaded pinned provider returns 429 and
  # the cell is simply lost. A 429 is billed $0, so retrying it cannot defeat
  # the cost cap -- unlike retrying a call that already produced tokens.
  rate_limit_retries: 3
  # Parallel API calls. Safe with the cost cap because dispatch happens in
  # waves: a wave is only sent if its whole worst case fits the headroom.
  concurrency: 12
  # Parallel graders. Free (no API), CPU- and subprocess-bound. An LCB problem
  # runs 43 tests twice, which is what made the serial pilot take a minute a
  # cell -- almost all of it waiting on grading rather than on the API.
  grade_concurrency: 6

# Runtime abort on reasoning length -- the thesis's intervention.
#
# Verified 2026-07-26 on two providers: `delta.reasoning` is observable live in
# the stream, aborting mid-reasoning is billed $0.00, and the same cell run to
# completion cost $0.010978. So this saves the WHOLE call, not a pro-rata part.
#
# Simulated over the pilot's thinking calls: aborting at 10,000 reasoning
# tokens kept 42/42 passes and cut spend 44%; at 6,000, 78% saved for 10%
# fewer solved. null disables it -- the grid must run unaborted first, or the
# threshold would be fitted on the data it is evaluated against.
abort:
  reasoning_tokens: null

sampling:
  # Fixed everywhere: sampling, splits, bootstrap. Reproducibility is graded.
  seed: 20260726

  # The pilot's job is NOT to produce results. It is to measure two numbers
  # that the whole budget depends on and that no amount of estimating can
  # supply: mean thinking tokens on HARD problems, and the saturation rate.
  #
  # Stratified, because the first real cell (HumanEval/0) was solved by all 10
  # configs. A pilot over easy problems would report ~100% everywhere and
  # teach us nothing.
  pilot:
    strata:
      humaneval_plus: 3
      mbpp_plus: 3
      livecodebench_easy: 2
      livecodebench_medium: 3
      livecodebench_hard: 4

  # The full grid. Final size is set BY the pilot, not before it.
  grid:
    strata:
      humaneval_plus: 60
      mbpp_plus: 90
      livecodebench_easy: 30
      livecodebench_medium: 50
      livecodebench_hard: 70
